services:
  postgres:
    image: postgres:16
    container_name: pontoflex-postgres
    environment:
      POSTGRES_DB: pontoflex
      POSTGRES_USER: pontoflex
      POSTGRES_PASSWORD: pontoflex
    ports:
      - "5432:5432"
    volumes:
      - pontoflex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pontoflex"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: pontoflex-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pontoflex
      SPRING_DATASOURCE_USERNAME: pontoflex
      SPRING_DATASOURCE_PASSWORD: pontoflex
    ports:
      - "8080:8080"

volumes:
  pontoflex_pgdata:
